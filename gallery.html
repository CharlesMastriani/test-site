<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stradale Auto Club - Gallery</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="important.css">

  <!-- Favicon -->
  <link rel="icon" href="Favicon.png" type="image/png">
</head>
<body>

  <nav class="navbar">
  <a href="#" class="navbar-logo">
    <img src="Favicon.png" alt="Stradale Auto Club Logo" class="logo">
    Stradale Auto Club
  </a>

  <div class="hamburger" id="hamburger">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="booking.html">Book</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

  <!-- GALLERY HERO SECTION -->
  <header class="gallery-hero">
    <div class="hero-content">
      <h1>Gallery</h1>
      <p class="tagline">Explore our premium auto services and craftsmanship</p>
    </div>
  </header>

  <!-- GALLERY GRID -->
  <section class="gallery-grid">
    <img src="images/car1.jpg" alt="Car 1">
    <img src="images/car2.jpg" alt="Car 2">
    <img src="images/car3.jpg" alt="Car 3">
    <img src="images/car4.jpg" alt="Car 4">
    <img src="images/car5.jpg" alt="Car 5">
    <img src="images/car6.jpg" alt="Car 6">
  </section>

  <!-- SCRIPTS -->
  <script>
  // Hamburger toggle
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('nav-links');
  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });

  // Smooth gliding navbar
  const navbar = document.querySelector('.navbar');
  const startTop = 24; // starting offset from top
  let currentTop = startTop;

  window.addEventListener('scroll', () => {
    const scrollY = window.scrollY;
    const targetTop = startTop + scrollY; // navbar follows scroll

    // Glide effect using linear interpolation
    currentTop += (targetTop - currentTop) * 0.1;
    navbar.style.top = `${currentTop}px`;
  });

  // Smooth scroll to top when logo clicked
  const logoLink = document.querySelector('.navbar-logo');
  logoLink.addEventListener('click', function(e) {
    e.preventDefault(); // prevent default jump
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  });
</script>



</body>
</html>
