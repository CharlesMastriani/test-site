<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stradale Auto Club - Gallery</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="important.css">

  <!-- Favicon -->
  <link rel="icon" href="Favicon.png" type="image/png">
</head>
<body>

  <nav class="navbar">
  <a href="#" class="navbar-logo">
    <img src="Favicon.png" alt="Stradale Auto Club Logo" class="logo">
    Stradale Auto Club
  </a>

  <div class="hamburger" id="hamburger">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="booking.html">Book</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

  <!-- GALLERY HERO SECTION -->
  <header class="gallery-hero">
    <div class="hero-content">
      <h1>Gallery</h1>
      <p class="tagline">Explore our premium auto services and craftsmanship</p>
    </div>
  </header>

  <!-- GALLERY GRID -->
<section class="gallery">
  <div class="gallery-grid">

    <div class="gallery-card">
      <div class="gallery-image" style="background-image: url('images/car1.jpg');"></div>
      <p class="gallery-caption">Hand Washing</p>
    </div>

    <div class="gallery-card">
      <div class="gallery-image" style="background-image: url('images/car2.jpg');"></div>
      <p class="gallery-caption">Detailing — Coming Soon</p>
    </div>

    <div class="gallery-card">
      <div class="gallery-image coming-soon"></div>
      <p class="gallery-caption">Service — Coming Soon</p>
    </div>

    <div class="gallery-card">
      <div class="gallery-image coming-soon"></div>
      <p class="gallery-caption">Modifications — Coming Soon</p>
    </div>

  </div>
</section>


  <!-- SCRIPTS -->
  <script>
  // Hamburger toggle
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('nav-links');
  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });

  // Smooth gliding navbar using requestAnimationFrame
  const navbar = document.querySelector('.navbar');
  const startTop = 24; // initial top offset
  let currentTop = startTop;

  function updateNavbar() {
    const scrollY = window.scrollY;
    const targetTop = startTop + scrollY;

    // Glide effect (larger factor for faster catch-up)
    currentTop += (targetTop - currentTop) * 0.25; 
    navbar.style.top = `${currentTop}px`;

    requestAnimationFrame(updateNavbar);
  }

  requestAnimationFrame(updateNavbar);

  // Smooth scroll to top when logo clicked
  const logoLink = document.querySelector('.navbar-logo');
  logoLink.addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  });
  // Gallery click-to-expand modal
const modal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImage');
const modalClose = document.getElementById('modalClose');

document.querySelectorAll('.gallery-grid img').forEach(img => {
  img.addEventListener('click', () => {
    modal.classList.add('active');
    modalImg.src = img.src;
    document.body.style.overflow = 'hidden';
  });
});

modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function closeModal() {
  modal.classList.remove('active');
  modalImg.src = '';
  document.body.style.overflow = '';
}

</script>
<!-- IMAGE MODAL -->
<div class="image-modal" id="imageModal">
  <span class="modal-close" id="modalClose">&times;</span>
  <img class="modal-content" id="modalImage" alt="Expanded gallery image">
</div>

</body>
</html>
