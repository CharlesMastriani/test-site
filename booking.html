<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stradale Auto Club | Booking</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="important.css">

  <!-- Favicon -->
  <link rel="icon" href="Favicon.png" type="image/png">
</head>
<body>

<nav class="navbar">
  <a href="#" class="navbar-logo">
    <img src="Favicon.png" alt="Stradale Auto Club Logo" class="logo">
    Stradale Auto Club
  </a>

  <div class="hamburger" id="hamburger">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="booking.html">Book</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="our-services.html">Our Services</a></li>
  </ul>
</nav>

<!-- HERO SECTION -->
<header class="hero booking-hero">
  <div class="hero-content">
    <h1>Book a Service</h1>
    <p class="tagline">Schedule your premium auto service with ease</p>
  </div>
</header>

<!-- BOOKING FORM -->
<section class="about">
  <h2>Booking Form</h2>
  <form id="booking-form" style="max-width: 600px; margin: 40px auto; text-align: left;">
    <!-- Name -->
    <label for="name">Full Name</label><br>
    <input type="text" id="name" name="name" placeholder="Your full name" required class="pill-input"><br>

    <!-- Email -->
    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" placeholder="Your email address" required class="pill-input"><br>

    <!-- Service Type -->
    <label for="service">Select Service</label><br>
    <select id="service" name="service" required class="pill-input">
      <option value="" disabled selected>Select a service</option>
      <option value="hand-wash">Premium Hand Wash</option>
      <option value="detailing">Full Detail</option>
      <option value="vehicle-service">Vehicle Service</option>
      <option value="modifications">Modifications</option>
    </select><br>

    <!-- Preferred Date -->
    <label for="date">Preferred Date</label><br>
    <input type="date" id="date" name="date" required class="pill-input"><br>

    <!-- Preferred Time -->
    <label for="time">Preferred Time</label><br>
    <input type="time" id="time" name="time" required class="pill-input"><br>

    <!-- Notes -->
    <label for="notes">Additional Notes</label><br>
    <textarea id="notes" name="notes" rows="4" placeholder="Any special requests?" class="pill-input"></textarea><br>

    <!-- Service Price Display -->
    <div id="service-price" class="service-price">
      <span>Price:</span> <span class="price-number">—</span>
    </div>

    <!-- Submit Button -->
    <div style="text-align: center; margin-top: 20px;">
      <button type="submit" class="booking-button">Submit Booking</button>
    </div>
  </form>
</section>

<!-- SCRIPTS -->
<script src="script.js"></script>
<script>
  // Dynamic Service Price
  const serviceSelect = document.getElementById('service');
  const priceNumber = document.querySelector('#service-price .price-number');

  const servicePrices = {
    "hand-wash": "$35",
    "detailing": "Coming Soon",
    "vehicle-service": "Coming Soon",
    "modifications": "Coming Soon"
  };

  serviceSelect.addEventListener('change', () => {
    const value = serviceSelect.value;
    priceNumber.textContent = servicePrices[value] || "—";
  });
</script>

</body>
</html>
