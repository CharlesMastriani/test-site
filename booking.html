<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stradale Auto Club | Booking</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="important.css">

  <!-- Favicon -->
  <link rel="icon" href="Favicon.png" type="image/png">

  <style>
    /* Price box styling */
    #service-price {
      display: inline-block;
      padding: 12px 32px;
      margin: 30px 0 20px;
      background-color: #f7f3ec;
      border: 1px solid #e0d8c8;
      border-radius: 50px; /* pill shape */
      text-align: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      color: #333;
      min-width: 200px;
    }

    /* Vertical spacing for form fields */
    #booking-form label {
      display: block;
      margin-top: 20px;
      margin-bottom: 6px;
      font-weight: 600;
      font-family: 'PT Serif', serif;
      font-size: 16px;
    }

    #booking-form input,
    #booking-form select,
    #booking-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      font-family: 'PT Serif', serif;
      font-size: 16px;
    }

    /* Submit button centered and nicely spaced */
    #booking-form .cta-button.booking-button {
      margin-top: 20px;
      padding: 14px 40px;
      font-size: 18px;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="#" class="navbar-logo">
    <img src="Favicon.png" alt="Stradale Auto Club Logo" class="logo">
    Stradale Auto Club
  </a>

  <div class="hamburger" id="hamburger">
    <div></div><div></div><div></div>
  </div>

  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="booking.html">Book</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="our-services.html">Our Services</a></li>
  </ul>
</nav>

<!-- HERO -->
<header class="hero booking-hero">
  <div class="hero-content">
    <h1>Book a Service</h1>
    <p class="tagline">Schedule your premium auto service with ease</p>
  </div>
</header>

<!-- BOOKING FORM -->
<section class="about">
  <h2>Booking Form</h2>

  <form id="booking-form" style="max-width: 600px; margin: 0 auto;">

    <!-- Name -->
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required placeholder="Your full name">

    <!-- Email -->
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="Your email address">

    <!-- Service -->
    <label for="service">Select Service</label>
    <select id="service" name="service" required>
      <option value="" disabled selected>Select a service</option>
      <option value="Hand Wash">Premium Hand Wash</option>
      <option value="Full Detail">Full Detail</option>
      <option value="Vehicle Service">Vehicle Service</option>
      <option value="Modifications">Modifications</option>
    </select>

    <!-- Service Price -->
    <div id="service-price">
      Select a service to see pricing
    </div>

    <!-- Date -->
    <label for="date">Preferred Date</label>
    <input type="date" id="date" name="date" required>

    <!-- Time -->
    <label for="time">Preferred Time</label>
    <input type="time" id="time" name="time" required>

    <!-- Notes -->
    <label for="notes">Additional Notes</label>
    <textarea id="notes" name="notes" rows="4" placeholder="Any special requests?"></textarea>

    <!-- Submit Button -->
    <div style="text-align:center;">
      <button type="submit" class="cta-button booking-button">
        Submit Booking
      </button>
    </div>

  </form>
</section>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
