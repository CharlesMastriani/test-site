<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stradale Auto Club | Booking</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="important.css">

  <!-- Favicon -->
  <link rel="icon" href="Favicon.png" type="image/png">

  <style>
    #service-price {
      display: inline-block;
      padding: 10px 25px;
      background-color: #F5F0E6;
      border-radius: 50px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
      min-width: 140px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    #service-price span.price-number {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      margin-left: 5px;
    }

    .booking-button {
      display: block;
      margin: 0 auto;
      background-color: #C6A664;
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .booking-button:hover {
      background-color: #800020;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="time"],
    textarea,
    select {
      border-radius: 50px;
      border: 1px solid #ccc;
      padding: 12px 20px;
      width: 100%;
      margin-bottom: 15px;
      font-family: 'PT Serif', serif;
      box-sizing: border-box;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }
  </style>
</head>

<body>

<nav class="navbar">
  <a href="#" class="navbar-logo">
    <img src="Favicon.png" alt="Stradale Auto Club Logo" class="logo">
    Stradale Auto Club
  </a>

  <div class="hamburger" id="hamburger">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="booking.html">Book</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="our-services.html">Our Services</a></li>
  </ul>
</nav>

<header class="hero booking-hero">
  <div class="hero-content">
    <h1>Book a Service</h1>
    <p class="tagline">Schedule your premium auto service with ease</p>
  </div>
</header>

<section class="about">
  <h2>Booking Form</h2>

  <!-- IMPORTANT:
       Replace the action URL below with your Formspree endpoint -->
  <form
  id="booking-form"
  action="https://formspree.io/f/mykkgqvw"
  method="POST"
>

  <label for="name">Full Name *</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email *</label>
  <input type="email" id="email" name="email" required>

<label for="service">Select Service *</label>
<select id="service" name="service" required>
  <option value="" disabled>Select a service</option>
  <option value="Premium Hand Wash">Premium Hand Wash</option>
  <option value="Full Detail">Full Detail</option>
  <option value="Vehicle Service">Vehicle Service</option>
  <option value="Modifications">Modifications</option>
</select>


  <label for="date">Preferred Date *</label>
  <input type="date" id="date" name="date" required>

  <label for="time">Preferred Time *</label>
  <input type="time" id="time" name="time" required>

  <label for="street">Street Address *</label>
  <input type="text" id="street" name="street" required>

  <label for="city">City *</label>
  <input type="text" id="city" name="city" required>

 <label for="state">State</label>
<select id="state" name="state" class="full-width-input" required>
  <option value="Connecticut" selected>Connecticut</option>
</select>



  <label for="zip">ZIP Code *</label>
  <input type="text" id="zip" name="zip" required>

  <label for="notes">Additional Notes </label>
  <textarea id="notes" name="notes"></textarea>

  <button type="submit" class="booking-button">
    Submit Booking
  </button>
</form>

</section>

<script src="script.js"></script>
</body>
</html>
