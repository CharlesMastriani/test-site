<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stradale Auto Club | Booking</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="important.css">

  <!-- Favicon -->
  <link rel="icon" href="Favicon.png" type="image/png">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="#" class="navbar-logo">
    <img src="Favicon.png" alt="Stradale Auto Club Logo" class="logo">
    Stradale Auto Club
  </a>

  <div class="hamburger" id="hamburger">
    <div></div><div></div><div></div>
  </div>

  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="booking.html">Book</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="our-services.html">Our Services</a></li>
  </ul>
</nav>

<!-- HERO -->
<header class="hero booking-hero">
  <div class="hero-content">
    <h1>Book a Service</h1>
    <p class="tagline">Schedule your premium auto service with ease</p>
  </div>
</header>

<!-- BOOKING FORM -->
<section class="about">
  <h2>Booking Form</h2>

  <form id="booking-form" style="max-width:600px;margin:0 auto;">

    <!-- Name -->
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required placeholder="Your full name">

    <!-- Email -->
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="Your email address">

    <!-- Service -->
    <label for="service">Select Service</label>
    <select id="service" name="service" required>
      <option value="" disabled selected>Select a service</option>
      <option value="Hand Wash">Premium Hand Wash</option>
      <option value="Full Detail">Full Detail</option>
      <option value="Vehicle Service">Vehicle Service</option>
      <option value="Modifications">Modifications</option>
    </select>

    <!-- Service Price -->
    <div id="service-price"
         style="
           margin:30px 0 20px;
           padding:18px;
           background:#f7f3ec;
           border:1px solid #e0d8c8;
           text-align:center;
           font-family:'Playfair Display', serif;
           font-size:18px;
         ">
      Select a service to see pricing
    </div>

    <!-- Date -->
    <label for="date">Preferred Date</label>
    <input type="date" id="date" name="date" required>

    <!-- Time -->
    <label for="time">Preferred Time</label>
    <input type="time" id="time" name="time" required>

    <!-- Notes -->
    <label for="notes">Additional Notes</label>
    <textarea id="notes" name="notes" rows="4" placeholder="Any special requests?"></textarea>

    <!-- Submit -->
    <div style="text-align:center;margin-top:30px;">
      <button type="submit" class="cta-button booking-button">
        Submit Booking
      </button>
    </div>

  </form>
</section>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
